  <link rel="stylesheet" href="./style.css">
  <script>
    // Add new post files here, newest first. Each one is pulled in full onto this page.
    const POSTS = ["zero-trust.html"];

    document.addEventListener("DOMContentLoaded", () => {
      fetch("./sidebar.html")
        .then(res => {
          if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
          return res.text();
        })
        .then(html => { document.getElementById("sidebar").innerHTML = html; })
        .catch(err => console.error("Could not load sidebar:", err));

      const feed = document.getElementById("feed");
      Promise.all(POSTS.map(file =>
        fetch("./" + file)
          .then(res => {
            if (!res.ok) throw new Error(`${file}: HTTP ${res.status}`);
            return res.text();
          })
          .then(html => {
            const doc = new DOMParser().parseFromString(html, "text/html");
            const article = doc.querySelector("article.post");
            if (!article) throw new Error(`${file}: no <article class="post"> found`);

            // Turn the post's title into a linked h2 for the feed
            const oldTitle = article.querySelector(".post-title");
            const title = document.createElement("h2");
            title.className = "post-title";
            const link = document.createElement("a");
            link.href = "./" + file;
            link.textContent = oldTitle.textContent;
            title.appendChild(link);
            oldTitle.replaceWith(title);

            // Drop the "Back to all posts" link
            article.querySelectorAll(".back-link").forEach(el => el.remove());
            return article;
          })
          .catch(err => {
            console.error("Could not load post:", err);
            const fallback = document.createElement("p");
            fallback.innerHTML = `<a href="./${file}">${file}</a>`;
            return fallback;
          })
      )).then(articles => {
        feed.replaceChildren(...articles);
      });
    });
  </script>
